<!doctype html>
<html>
    <head>
        <title>Chats</title>
        <link rel="stylesheet" href="chats.css">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
    </head>
    <body>
        <h1></h1>
        <div class="chats_list">
            
        </div>

        <div class="messaging">
            <div class="nav">
                <p class="back">&larr;</p>
                <p class="chat_name"></p>
            </div>
            <div class="messages">
                
            </div>
            <div class="typing">
                <input type="text" name="message" id="message">
                <p class="send">&#9992;</p>
            </div>
        </div>

        <div class="search">
            <div class="search_input">
                <label for="search">&#x1F50D;</label>
                <input type="text" id="search" name="search" placeholder="search people">
            </div>
            
            <div class="search_res">
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script src="chats.js"></script>
    </body>
</html>
